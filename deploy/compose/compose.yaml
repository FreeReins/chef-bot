# ChefBot with Docker Compose (or podman compose). Before the first start:
#   1. Replace both change-me passwords with the same long random password.
#   2. Set TZ to your time zone, such as Europe/London.
# Then run `docker compose up -d` and open http://<this machine>:8080.
# Guide: https://jamiethenextkevinbaconhamm.github.io/chef-bot/getting-started/install-docker-compose/
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chefbot
      POSTGRES_USER: chefbot
      POSTGRES_PASSWORD: change-me
    volumes:
      - chefbot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chefbot -d chefbot"]
      interval: 5s
      retries: 12

  chefbot:
    image: ghcr.io/jamiethenextkevinbaconhamm/chef-bot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__ChefBot: Host=db;Port=5432;Database=chefbot;Username=chefbot;Password=change-me
      TZ: America/Chicago
      # More settings: https://jamiethenextkevinbaconhamm.github.io/chef-bot/admin/settings/
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS. If you change the left-hand number, also set Https__PublicPort to it.
    volumes:
      - chefbot-keys:/app/keys        # sign-in keys and the HTTPS certificate: keep this
      - chefbot-backups:/app/backups  # daily backups

volumes:
  chefbot-db:
  chefbot-keys:
  chefbot-backups:
