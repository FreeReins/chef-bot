# Checks every pull request: the .NET build and tests, the whole container image (web page, documentation, base
# images) and the web page's Playwright tests. The "checks" job passes only when all of them do; it is the check the
# main branch ruleset requires, so Dependabot's auto-merge waits for it (see CONTRIBUTING.md, Releases).
# The "changes" job skips a check the pull request can't affect: the web tests run only when the web page or this file
# changed, and the image only when something besides Markdown outside docs/, workflows or agent files changed. A
# skipped check still counts as passed, so a pull request that only edits links.yml or README.md isn't held up.
# The same file works in another repo with this layout: change WEB_DIR.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_DIR: src/ChefBot.Web

jobs:
  # dorny/paths-filter reads the pull request's changed files. With predicate-quantifier "every", a file counts only
  # when it matches every pattern of a filter, so the "!" patterns leave files out.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.docs == 'true' || steps.filter.outputs.ci == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.github/**'
              - '!.claude/**'
              - '!evals/**'
              - '!lychee.toml'
            docs:
              - 'docs/**'
            web:
              - 'src/ChefBot.Web/**'
              - '!src/ChefBot.Web/**/*.md'
            ci:
              - '.github/workflows/ci.yml'

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run the tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          cache-from: type=gha,scope=linux-amd64
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=linux-amd64

  # Split across runners; each uses all its cores (playwright.config.js).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: ${{ env.WEB_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard ${{ matrix.shard }}/3

  checks:
    if: always()
    needs: [changes, image, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Every check passed
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "A check didn't pass: $RESULTS"
            exit 1
          fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
