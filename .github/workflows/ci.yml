# Checks every pull request: the .NET build and tests, the whole container image (web page, documentation, base
# images) and the web page's Playwright tests. The "checks" job passes only when all of them do; it is the check the
# main branch ruleset requires, so Dependabot's auto-merge waits for it (see CONTRIBUTING.md, Releases).
# The same file works in another repo with this layout: change WEB_DIR.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_DIR: src/ChefBot.Web

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Run the tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha,scope=linux-amd64
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=linux-amd64

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.WEB_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  checks:
    if: always()
    needs: [image, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Every check passed
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* || "$RESULTS" == *skipped* ]]; then
            echo "A check didn't pass: $RESULTS"
            exit 1
          fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
