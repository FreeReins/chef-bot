# Turns on auto-merge for Dependabot's minor and patch updates, so GitHub squash merges them once the ruleset's required
# checks pass; a merged "fix(deps): ..." then releases a patch version. Major updates stay open for a person to review.
# Auto-merge is turned on with AUTOMERGE_TOKEN, not the workflow's own token, because a merge made with the workflow's
# token doesn't start the release workflow. See CONTRIBUTING.md, Releases, for the token and settings.
# The same file works in any repo.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        name: Merge when the checks pass
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
