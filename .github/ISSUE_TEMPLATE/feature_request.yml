name: Idea or feature request
description: Suggest something that would make ChefBot better for your kitchen.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could ChefBot help?
      description: Your idea, if you have one. Rough is fine.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Planning
        - Recipes
        - Shopping list
        - Pantry
        - Cooking mode
        - Calendar, notifications or integrations
        - Installing or running ChefBot
        - Documentation
        - Something else
